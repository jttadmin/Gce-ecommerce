name: Kart Ecommerce CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GAR_LOCATION: asia-south1
  GAR_REPOSITORY: kart-ecommerce

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # Build each application image independently.
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: ./frontend
          - service: gateway
            context: ./gateway
          - service: user-service
            context: ./user-service
          - service: catalog-service
            context: ./catalog-service
          - service: cart-service
            context: ./cart-service
          - service: order-service
            context: ./order-service
          - service: notification-service
            context: ./notification-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate Dockerfile
        run: test -f "${{ matrix.context }}/Dockerfile"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry Docker authentication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gcloud auth configure-docker \
            "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-gitops:
    name: Update GitOps image tags
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install yq
        run: |
          sudo wget -q \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 \
            -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update image tags in Kustomize file
        working-directory: gitops
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          IMAGE_TAG: ${{ github.sha }}
          KUSTOMIZATION_FILE: ${{ vars.GITOPS_KUSTOMIZATION_PATH }}
        run: |
          set -euo pipefail
          test -n "${KUSTOMIZATION_FILE}"
          test -f "${KUSTOMIZATION_FILE}"

          REGISTRY="${GAR_LOCATION}-docker.pkg.dev"
          REPOSITORY="${PROJECT_ID}/${GAR_REPOSITORY}"

          for SERVICE in \
            frontend \
            gateway \
            user-service \
            catalog-service \
            cart-service \
            order-service \
            notification-service
          do
            IMAGE="${REGISTRY}/${REPOSITORY}/${SERVICE}"

            IMAGE_NAME="${IMAGE}" \
            yq -e \
              '.images[] | select(.name == strenv(IMAGE_NAME))' \
              "${KUSTOMIZATION_FILE}" >/dev/null

            IMAGE_NAME="${IMAGE}" IMAGE_TAG="${IMAGE_TAG}" \
            yq -i \
              '(.images[] | select(.name == strenv(IMAGE_NAME)).newTag) = strenv(IMAGE_TAG)' \
              "${KUSTOMIZATION_FILE}"
          done

          git diff --check
          git diff

      - name: Commit and push GitOps changes
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git add "${{ vars.GITOPS_KUSTOMIZATION_PATH }}"
          git commit -m "chore: deploy ecommerce ${IMAGE_TAG}"
          git push
