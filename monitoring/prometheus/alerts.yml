groups:
  - name: ecommerce
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is down"

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
            / sum by (service) (rate(http_requests_total[5m])) > 0.05
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} 5xx ratio above 5%"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} p95 latency above 1s"

      - alert: KafkaConsumerLagHigh
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag) > 100
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Consumer group {{ $labels.consumergroup }} lagging on {{ $labels.topic }}"

      - alert: OutboxBacklog
        expr: outbox_pending_events > 50
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Order outbox is not draining (Kafka publish problem?)"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Redis memory above 90% of maxmemory"
